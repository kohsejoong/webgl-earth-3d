<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D Earth - WebGL</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee;
    font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #container { display: flex; width: 100%; height: 100%; }
  #controls { width: 280px; flex-shrink: 0; padding: 20px; box-sizing: border-box;
    background: #252526; border-right: 1px solid #3c3c3c; overflow-y: auto; }
  #controls h1 { font-size: 18px; margin: 0 0 4px; }
  #controls p.desc { font-size: 12px; color: #aaa; margin: 0 0 20px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: #ddd; }
  .field .value { color: #4fc1ff; font-weight: bold; }
  input[type="range"], select { width: 100%; }
  select { padding: 6px; background: #1e1e1e; color: #eee; border: 1px solid #3c3c3c; border-radius: 4px; }
  #stats { font-size: 12px; color: #999; line-height: 1.6; border-top: 1px solid #3c3c3c;
    padding-top: 12px; }
  #stats span { color: #4fc1ff; }
  #canvasWrap { flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; min-width: 0; }
  canvas { display: block; width: min(90vw, 92vh, 820px); height: min(90vw, 92vh, 820px); cursor: grab; }
</style>
</head>
<body>
<div id="container">
  <div id="controls">
    <h1>3D Earth</h1>
    <p class="desc">위/경도 격자 구 + 공개 고도 자료(NASA)로 지형을 표현한 WebGL 지구. 마우스 드래그로 시점 회전.</p>

    <div class="field">
      <label>자전 속도: <span class="value" id="spinSpeedValue"></span> °/s</label>
      <input type="range" id="spinSpeed" min="0" max="60" step="1" value="10">
    </div>
    <div class="field">
      <label>태양 방향 (공전 각도): <span class="value" id="sunAngleValue"></span>°</label>
      <input type="range" id="sunAngle" min="0" max="360" step="1" value="0">
      <label><input type="checkbox" id="sunAuto"> 태양 자동 이동 (공전)</label>
    </div>
    <div class="field">
      <label>고도 과장 배율: <span class="value" id="exagValue"></span>×</label>
      <input type="range" id="exag" min="0" max="100" step="1" value="30">
    </div>
    <div class="field">
      <label>주변광 세기: <span class="value" id="ambientValue"></span></label>
      <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.08">
    </div>
    <div class="field">
      <label>반짝임 계수 (shininess): <span class="value" id="shininessValue"></span></label>
      <input type="range" id="shininess" min="5" max="400" step="5" value="150">
    </div>
    <div class="field">
      <label>지표 색상</label>
      <select id="mode">
        <option value="0">위성 영상 (Blue Marble)</option>
        <option value="1">고도별 색상 (Hypsometric)</option>
      </select>
    </div>
    <div class="field">
      <label><input type="checkbox" id="nightLights" checked> 야간 도시 불빛</label>
    </div>
    <div class="field">
      <label>초기 자전 각도: <span class="value" id="spinValue"></span>°</label>
      <input type="range" id="spin" min="0" max="360" step="1" value="0">
    </div>
    <div class="field">
      <label>카메라 거리: <span class="value" id="distValue"></span></label>
      <input type="range" id="dist" min="1.5" max="8" step="0.1" value="3.2">
    </div>

    <div id="stats">
      격자: <span id="grid"></span><br>
      정점 / 삼각형: <span id="counts"></span><br>
      FPS: <span id="fps">-</span><br>
      상태: <span id="status">텍스처 로딩 중…</span>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="glcanvas" width="820" height="820"></canvas>
  </div>
</div>
<script src="earth.js"></script>
</body>
</html>
